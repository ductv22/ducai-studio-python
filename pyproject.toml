[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ducai-studio"
version = "2.0.0a118"
description = "Maintainable desktop pipeline for Vietnamese video dubbing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "DUCAI STUDIO" }]
dependencies = [
  "cryptography>=45,<48",
  "packaging>=24,<27",
  "playwright>=1.55,<2",
  "PySide6>=6.8,<7",
]

[project.scripts]
ducai-studio = "ducai_studio.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ducai_studio"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
